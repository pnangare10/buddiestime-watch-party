plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Applied conditionally (not in the plugins block above) so this module still
// builds via ./gradlew before a real Firebase project + google-services.json
// exist (see D2 in the pairing/onboarding plan) — the plugin fails the build
// loudly if the file is missing, and FCM is meant to degrade gracefully like
// every other optionally-configured integration in this app.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.buddiestime.watchparty'
    compileSdk 34

    defaultConfig {
        applicationId "com.fluffles.watchparty"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def ksPath  = System.getenv("KEYSTORE_PATH") ?: "release.keystore"
            def ksPwd   = System.getenv("STORE_PASSWORD")
            def kAlias  = System.getenv("KEY_ALIAS")
            def kPwd    = System.getenv("KEY_PASSWORD")

            if (gradle.startParameter.taskNames.any { it.contains("Release") }) {
                if (!ksPwd || !kAlias || !kPwd) {
                    throw new GradleException(
                        "Release signing requires STORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD env vars"
                    )
                }
            }

            storeFile     file(ksPath)
            storePassword (ksPwd ?: "")
            keyAlias      (kAlias ?: "")
            keyPassword   (kPwd ?: "")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // LiveKit — voice SFU client
    implementation 'io.livekit:livekit-android:2.24.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Firebase Cloud Messaging — push nudges. Requires app/google-services.json
    // from a real Firebase project (see D2 in the pairing/onboarding plan); the
    // google-services plugin fails the build loudly if that file is missing.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json impl on the unit-test classpath — the framework org.json in android.jar
    // is stubbed ("not mocked") for local unit tests, so RoomStatus/RecentRooms JSON tests need this.
    testImplementation 'org.json:json:20231013'
}
