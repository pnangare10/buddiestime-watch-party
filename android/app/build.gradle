plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.buddiestime.watchparty'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.buddiestime.watchparty"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Replace YOUR_RAILWAY_URL with the actual Railway domain after deploying
        buildConfigField "String", "SERVER_URL", '"wss://YOUR_RAILWAY_URL"'
    }

    signingConfigs {
        release {
            def ksPath  = System.getenv("KEYSTORE_PATH") ?: "release.keystore"
            def ksPwd   = System.getenv("STORE_PASSWORD")
            def kAlias  = System.getenv("KEY_ALIAS")
            def kPwd    = System.getenv("KEY_PASSWORD")

            if (gradle.startParameter.taskNames.any { it.contains("Release") }) {
                if (!ksPwd || !kAlias || !kPwd) {
                    throw new GradleException(
                        "Release signing requires STORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD env vars"
                    )
                }
            }

            storeFile     file(ksPath)
            storePassword (ksPwd ?: "")
            keyAlias      (kAlias ?: "")
            keyPassword   (kPwd ?: "")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.12.0'
}
