pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // io.livekit:livekit-android depends on com.github.davidliu:audioswitch,
        // published only on JitPack (not Maven Central or Google's repo).
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "HotstarWatchParty"
include ':app'
