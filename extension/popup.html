<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Party</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Watch Party</h1>

    <div id="view-service">
      <div class="platform-grid">
        <div class="platform-card" data-platform="hotstar">
          <div class="platform-logo hotstar-logo">★</div>
          <span>JioHotstar</span>
        </div>
        <div class="platform-card" data-platform="youtube">
          <div class="platform-logo youtube-logo">▶</div>
          <span>YouTube</span>
        </div>
        <div class="platform-card" data-platform="primevideo">
          <div class="platform-logo prime-logo">P</div>
          <span>Prime Video</span>
        </div>
        <div class="platform-card" data-platform="netflix">
          <div class="platform-logo netflix-logo">N</div>
          <span>Netflix</span>
        </div>
      </div>
      <label>Room Name
        <input id="room-name" type="text" placeholder="e.g. movie-night" />
      </label>
      <div class="row">
        <button id="btn-create">⊕ Create Room</button>
        <button id="btn-join">→ Join Room</button>
      </div>
    </div>

    <div id="view-connected" class="hidden">
      <div id="status-line"></div>
      <div id="room-info"></div>
      <div id="share-section" class="hidden">
        <p class="label">Share this link with your partner:</p>
        <div class="share-box">
          <input id="share-url" type="text" readonly />
          <button id="btn-copy">Copy</button>
        </div>
        <div id="bookmarklet-hint" class="hint">
          Partner on phone? Have them open the <strong>install page</strong> to get the bookmarklet.
        </div>
      </div>
      <button id="btn-leave">Leave Party</button>
    </div>

    <div id="msg" class="msg hidden"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
